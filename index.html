<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LCP Hero Image: prioridad nativa via fetchpriority="high" + loading="eager" en el <img> del componente -->
    <link rel="preload" as="image" href="/hero-desktop.webp?v=17" media="(min-width: 900px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-mobile.webp?v=17" media="(max-width: 899px)" fetchpriority="high" />
    <!-- Favicons y App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.webp" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO y Meta Tags Base (serán sobreescritos por React Helmet) -->
    <title>Patitas de Amor Barquisimeto · Adopción y Rescate Animal</title>
    <meta name="description" content="Fundación de rescate y adopción responsable de perros y gatos en Barquisimeto, Estado Lara, Venezuela. Transforma una vida hoy." />
    <meta name="theme-color" content="#65C620" />
    <link rel="canonical" href="https://patitasdeamorbqto.com/" />

    <!-- Geo-Metatags (Local SEO para Barquisimeto, Lara) -->
    <meta name="geo.region" content="VE-K" />
    <meta name="geo.placename" content="Barquisimeto" />
    <meta name="geo.position" content="10.0645;-69.3569" />
    <meta name="ICBM" content="10.0645, -69.3569" />

    <!-- OpenGraph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://patitasdeamorbqto.com/" />
    <meta property="og:title" content="Patitas de Amor Barquisimeto · Refugio y Adopción" />
    <meta property="og:description" content="Fundación de rescate y adopción responsable de perros y gatos en Barquisimeto. Ayúdanos a cambiar sus vidas." />
    <meta property="og:image" content="https://patitasdeamorbqto.com/hero-desktop.webp" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://patitasdeamorbqto.com/" />
    <meta name="twitter:title" content="Patitas de Amor Barquisimeto" />
    <meta name="twitter:description" content="Fundación de rescate animal en Barquisimeto, Venezuela. Adopta, apadrina o dona." />
    <meta name="twitter:image" content="https://patitasdeamorbqto.com/hero-desktop.webp" />

    <!-- JSON-LD Schema.org para Refugios de Animales -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AnimalShelter",
      "name": "Patitas de Amor Barquisimeto",
      "url": "https://patitasdeamorbqto.com/",
      "logo": "https://patitasdeamorbqto.com/logo.svg",
      "image": "https://patitasdeamorbqto.com/hero-desktop.webp",
      "description": "Fundación dedicada al rescate, rehabilitación y adopción responsable de perros y gatos en situación de calle en Barquisimeto, Venezuela.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Barquisimeto",
        "addressRegion": "Lara",
        "addressCountry": "VE"
      }
    }
    </script>

    <!-- Favicon & PWA -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.webp" />

    <!-- Tipografía Inter (Google Fonts) asíncrona -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          background-color: #FAFAF8;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .app-shell-topbar {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 2.5px;
          background: linear-gradient(90deg, #65C620, #84E036, #65C620);
          background-size: 200% 100%;
          z-index: 10000;
          transform-origin: 0% 50%;
          animation: app-shell-progress 1.4s ease-in-out infinite;
        }
        @keyframes app-shell-progress {
          0% { transform: scaleX(0.08) translateX(-10%); }
          50% { transform: scaleX(0.65) translateX(30%); }
          100% { transform: scaleX(1) translateX(100%); }
        }
        .app-shell-nav {
          height: 64px;
          background-color: #FFFFFF;
          border-bottom: 1px solid rgba(0, 0, 0, 0.06);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 24px;
          box-sizing: border-box;
        }
        .app-shell-brand {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .app-shell-logo {
          width: 38px;
          height: 38px;
          border-radius: 50%;
          background: #EEF8E8;
        }
        .app-shell-title {
          width: 140px;
          height: 18px;
          border-radius: 4px;
          background: #E2E8F0;
        }
        .app-shell-actions {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .app-shell-btn {
          width: 80px;
          height: 34px;
          border-radius: 9999px;
          background: #F1F5F9;
        }
        .app-shell-hero {
          position: relative;
          min-height: calc(100vh - 64px);
          background-color: #0F172A;
          display: flex;
          flex-direction: column;
          justify-content: center;
          overflow: hidden;
        }
        .app-shell-picture {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          z-index: 0;
        }
        .app-shell-picture img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: right 77%;
          display: block;
        }
        .app-shell-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, rgba(15,23,42,0.90) 0%, rgba(15,23,42,0.65) 45%, rgba(15,23,42,0.15) 75%, transparent 100%);
          z-index: 1;
        }
        .app-shell-content {
          position: relative;
          z-index: 2;
          padding: 0 24px;
          max-width: 650px;
          box-sizing: border-box;
        }
        .app-shell-badge {
          width: 220px;
          height: 32px;
          border-radius: 9999px;
          background: rgba(53, 180, 221, 0.22);
          margin-bottom: 24px;
          border: 1px solid rgba(53, 180, 221, 0.4);
        }
        .app-shell-h1 {
          width: 90%;
          height: 56px;
          border-radius: 8px;
          background: rgba(255, 255, 255, 0.15);
          margin-bottom: 16px;
        }
        .app-shell-p {
          width: 75%;
          height: 24px;
          border-radius: 6px;
          background: rgba(255, 255, 255, 0.10);
          margin-bottom: 32px;
        }
        @media (max-width: 600px) {
          .app-shell-nav {
            height: 56px;
            padding: 0 16px;
          }
          .app-shell-hero {
            min-height: calc(100dvh - 56px);
            justify-content: flex-start;
            padding-top: 24px;
          }
          .app-shell-picture img {
            object-position: center bottom;
          }
          .app-shell-overlay {
            background: linear-gradient(180deg, rgba(15,23,42,0.92) 0%, rgba(15,23,42,0.70) 50%, rgba(15,23,42,0.10) 75%, transparent 100%);
          }
        }
      </style>
      <div class="app-shell-topbar" aria-hidden="true"></div>
      <header class="app-shell-nav" aria-hidden="true">
        <div class="app-shell-brand">
          <div class="app-shell-logo"></div>
          <div class="app-shell-title"></div>
        </div>
        <div class="app-shell-actions">
          <div class="app-shell-btn"></div>
        </div>
      </header>
      <section class="app-shell-hero" aria-hidden="true">
        <picture class="app-shell-picture">
          <source media="(min-width: 900px)" srcset="/hero-desktop.webp?v=17" width="1920" height="1080">
          <img src="/hero-mobile.webp?v=17" alt="" fetchpriority="high" loading="eager" decoding="sync" width="800" height="1200">
        </picture>
        <div class="app-shell-overlay"></div>
        <div class="app-shell-content">
          <div class="app-shell-badge"></div>
          <div class="app-shell-h1"></div>
          <div class="app-shell-p"></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
